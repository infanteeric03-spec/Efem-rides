# Revisa que las emisoras guardadas de partida tengan enlaces que funcionen (a petición y cada lunes).
name: Comprobar emisoras

on:
  workflow_dispatch:
    inputs:
      listar:
        description: "Listar todas las emisoras encontradas"
        type: boolean
        default: false
      extra:
        description: "Enlaces extra que probar (separados por espacios)"
        type: string
        default: ""
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  radio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Probar enlaces
        env:
          LISTAR: ${{ inputs.listar && '1' || '' }}
          EXTRA: ${{ inputs.extra }}
        run: node scripts/check-radio.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: informe-emisoras
          path: radio-report.md
