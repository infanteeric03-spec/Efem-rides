# Compila la app Android a partir de la web y la publica como descarga en "Releases".
name: App Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Preparar la web dentro de la app
        working-directory: app
        run: |
          npm ci
          npm run sync

      - name: Compilar el APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../../ruta-con-historia.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ruta-con-historia-apk
          path: ruta-con-historia.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: App Android ${{ github.run_number }}
          body: |
            Descarga **ruta-con-historia.apk** en el móvil Android y ábrelo para instalarlo.
            Versión web incluida: ${{ github.sha }}
          files: ruta-con-historia.apk
          make_latest: true
