# Compila la app Android a partir de la web y la publica como descarga en "Releases".
name: App Android

# Se compila a petición (pestaña Actions, "Run workflow") o la lanza cada noche "Comprobación nocturna del APK" si hay cambios.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    # Ubuntu 24.04 trae el SDK de Android instalado.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Comprobar el SDK de Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -5
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Preparar la web dentro de la app
        working-directory: app
        env:
          APP_BUILD: ${{ github.run_number }}
        run: |
          npm ci
          npm run sync

      - name: Compilar el APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk ../../ruta-con-historia.apk

      - name: Resumen del error
        if: failure()
        working-directory: app/android
        run: |
          { grep -E "^e: |error:|ERROR:" build.log | head -15; grep -A 12 "What went wrong" build.log | head -25; } | sed 's/%/%25/g' | while IFS= read -r l; do [ -n "$l" ] && echo "::error::$l"; done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ruta-con-historia-apk
          path: ruta-con-historia.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: App Android ${{ github.run_number }}
          body: |
            Descarga **ruta-con-historia.apk** en el móvil Android y ábrelo para instalarlo.
            Versión web incluida: ${{ github.sha }}
          files: ruta-con-historia.apk
          make_latest: true
